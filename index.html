<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Kaishi Music Player</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-base: #121212;
            --bg-elevated: #181818;
            --bg-highlight: #282828;
            --text-base: #ffffff;
            --text-subdued: #a7a7a7;
            --brand-color: #1ed760;
            --nav-height: 65px;
            --mini-player-height: 60px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-base);
            overflow-x: hidden;
            scrollbar-width: none; 
        }
        body::-webkit-scrollbar { display: none; }

        /* HEADER */
        header {
            padding: 40px 20px 20px 20px;
            background: linear-gradient(180deg, rgba(30,215,96,0.2) 0%, var(--bg-base) 100%);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .greeting {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        /* VIEWS */
        .view {
            display: none;
            padding: 0 20px 150px 20px;
            animation: fadeIn 0.3s ease;
        }
        .view.active { display: block; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 20px 0 15px 0;
        }

        /* LIST ITEM UI */
        .song-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .song-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .song-item:active { background: var(--bg-highlight); }
        .song-cover {
            width: 52px;
            height: 52px;
            border-radius: 6px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .song-info {
            flex: 1;
            overflow: hidden;
        }
        .song-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-base);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-artist {
            font-size: 0.8rem;
            color: var(--text-subdued);
            margin-top: 4px;
        }
        .song-action {
            color: var(--text-subdued);
            font-size: 1.1rem;
            padding: 10px;
        }
        .song-item.playing .song-title { color: var(--brand-color); }

        /* SEARCH INPUT */
        .search-box-container {
            position: relative;
            margin-bottom: 20px;
        }
        .search-box {
            width: 100%;
            background: #242424;
            border: 1px solid transparent;
            padding: 14px 20px 14px 45px;
            border-radius: 30px;
            color: white;
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus { border-color: var(--brand-color); }
        .search-box::placeholder { color: var(--text-subdued); }
        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-subdued);
        }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: rgba(18, 18, 18, 0.96);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-subdued);
            font-size: 0.7rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-item i { font-size: 1.3rem; }
        .nav-item.active { color: var(--text-base); }

        /* MINI PLAYER */
        .mini-player {
            position: fixed;
            bottom: calc(var(--nav-height) + 8px);
            left: 2%;
            width: 96%;
            height: var(--mini-player-height);
            background: var(--bg-elevated);
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            z-index: 99;
            transform: translateY(150%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .mini-player.visible { transform: translateY(0); }
        .mp-cover { width: 42px; height: 42px; border-radius: 4px; object-fit: cover; }
        .mp-info { flex: 1; overflow: hidden; }
        .mp-title { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mp-artist { font-size: 0.75rem; color: var(--text-subdued); }
        .mp-controls { display: flex; gap: 16px; align-items: center; font-size: 1.2rem; }
        .play-pause-btn { color: white; }

        /* FULL SCREEN PLAYER */
        .full-player {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            background: linear-gradient(180deg, #2a2a2a 0%, var(--bg-base) 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding: 20px 24px 30px 24px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), background 0.5s ease;
        }
        .full-player.open { transform: translateY(0); }
        .fp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 1.2rem;
        }
        .fp-header i { cursor: pointer; padding: 5px; }
        .fp-cover-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 20px 0 30px 0;
        }
        .fp-cover {
            width: 100%;
            max-width: 340px;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }
        .fp-info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .fp-title { font-size: 1.4rem; font-weight: 700; line-height: 1.2; }
        .fp-artist { font-size: 0.95rem; color: var(--text-subdued); margin-top: 6px; }
        
        .fp-fav { font-size: 1.4rem; color: var(--text-subdued); transition: transform 0.2s, color 0.2s; cursor: pointer; }
        .fp-fav.active { color: var(--brand-color); }
        .fp-fav:active { transform: scale(1.2); }

        /* PROGRESS BAR */
        .progress-container { margin-bottom: 20px; cursor: pointer; padding: 10px 0; }
        .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            background: white;
            width: 0%;
            border-radius: 2px;
            position: relative;
        }
        .progress-bar-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: -4px;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-subdued);
            margin-top: 8px;
            font-weight: 500;
        }

        /* FP CONTROLS */
        .fp-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            margin-bottom: 25px;
        }
        .fp-ctrl-btn { font-size: 1.3rem; color: var(--text-subdued); cursor: pointer; transition: color 0.2s; }
        .fp-ctrl-btn.active { color: var(--brand-color); }
        .fp-ctrl-main { font-size: 1.8rem; color: white; cursor: pointer; }
        .fp-ctrl-play {
            font-size: 3.8rem;
            color: white;
            transition: transform 0.1s;
            cursor: pointer;
        }
        .fp-ctrl-play:active { transform: scale(0.92); }

        /* VOLUME BAR */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-subdued);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .volume-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.2);
            outline: none;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }

        /* Actions */
        .fp-actions {
            display: flex;
            justify-content: center;
        }
        .btn-download {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-download:active { background: rgba(255,255,255,0.2); }

        .footer-text {
            text-align: center;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.3);
            margin-top: 30px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-subdued);
        }
        .empty-state i { font-size: 3rem; margin-bottom: 15px; opacity: 0.5; }

        /* TOAST NOTIFICATION */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #e74c3c;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 2000;
            transition: transform 0.3s ease;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="toast" class="toast">Gagal memutar lagu</div>

    <script src="music-data.js"></script>

    <header id="header">
        <h1 class="greeting" id="timeGreeting">Selamat Datang</h1>
    </header>

    <!-- HOME VIEW -->
    <main id="view-home" class="view active">
        <h2 class="section-title">Baru Ditambahkan</h2>
        <div class="song-list" id="home-list"></div>
        <div class="footer-text">2026-2027 &copy; Kaishi</div>
    </main>

    <!-- SEARCH VIEW -->
    <main id="view-search" class="view">
        <h1 class="greeting">Cari Musik</h1>
        <div class="search-box-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" class="search-box" id="searchInput" placeholder="Artis, lagu, atau podcast...">
        </div>
        <div class="song-list" id="search-list"></div>
        <div class="footer-text">2026-2027 &copy; Kaishi</div>
    </main>

    <!-- LIBRARY VIEW -->
    <main id="view-library" class="view">
        <h1 class="greeting">Koleksi Kamu</h1>
        <h2 class="section-title">Lagu Disukai</h2>
        <div class="song-list" id="library-list"></div>
        <div class="footer-text">2026-2027 &copy; Kaishi</div>
    </main>

    <!-- MINI PLAYER -->
    <div class="mini-player" id="miniPlayer" onclick="openFullPlayer()">
        <img src="" alt="Cover" class="mp-cover" id="mpCover">
        <div class="mp-info">
            <div class="mp-title" id="mpTitle">Title</div>
            <div class="mp-artist" id="mpArtist">Artist</div>
        </div>
        <div class="mp-controls">
            <i class="far fa-heart" id="mpFavBtn" onclick="toggleFav(event)"></i>
            <i class="fas fa-play play-pause-btn" id="mpPlayBtn" onclick="togglePlay(event)"></i>
        </div>
    </div>

    <!-- FULL SCREEN PLAYER -->
    <div class="full-player" id="fullPlayer">
        <div class="fp-header">
            <i class="fas fa-chevron-down" onclick="closeFullPlayer()"></i>
            <span style="font-size: 0.75rem; font-weight: 700; letter-spacing: 1px;">SEDANG DIPUTAR</span>
            <i class="fas fa-ellipsis-h"></i>
        </div>
        
        <div class="fp-cover-container">
            <img src="" alt="Cover" class="fp-cover" id="fpCover" crossorigin="anonymous">
        </div>
        
        <div class="fp-info-row">
            <div>
                <div class="fp-title" id="fpTitle">Title</div>
                <div class="fp-artist" id="fpArtist">Artist</div>
            </div>
            <i class="far fa-heart fp-fav" id="fpFavBtn" onclick="toggleFav(event)"></i>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar-bg" id="progressBarBg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
            <div class="time-row">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
        </div>

        <div class="fp-controls">
            <i class="fas fa-random fp-ctrl-btn" id="shuffleBtn" onclick="toggleShuffle()"></i>
            <i class="fas fa-step-backward fp-ctrl-main" onclick="prevSong()"></i>
            <i class="fas fa-play-circle fp-ctrl-play" id="fpPlayBtn" onclick="togglePlay(event)"></i>
            <i class="fas fa-step-forward fp-ctrl-main" onclick="nextSong()"></i>
            <i class="fas fa-redo fp-ctrl-btn" id="repeatBtn" onclick="toggleRepeat()"></i>
        </div>

        <div class="volume-container">
            <i class="fas fa-volume-down"></i>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="1">
            <i class="fas fa-volume-up"></i>
        </div>

        <div class="fp-actions">
            <a href="#" class="btn-download" id="downloadBtn" download target="_blank">
                <i class="fas fa-arrow-down"></i> Download MP3
            </a>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchView('home')">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </div>
        <div class="nav-item" onclick="switchView('search')">
            <i class="fas fa-search"></i>
            <span>Search</span>
        </div>
        <div class="nav-item" onclick="switchView('library')">
            <i class="fas fa-book-open"></i>
            <span>Library</span>
        </div>
    </nav>

    <audio id="audioPlayer" crossorigin="anonymous"></audio>

    <script>
        // State Management
        let songs = typeof musicDatabase !== 'undefined' ? musicDatabase : [];
        let favorites = JSON.parse(localStorage.getItem('kaishi_favs')) || [];
        
        let currentIndex = -1;
        let isPlaying = false;
        let isShuffle = false;
        let repeatState = 0; // 0: Off, 1: Repeat All, 2: Repeat One
        let playHistory = [];

        const audio = document.getElementById('audioPlayer');

        // Initial Dynamic Greeting
        function updateGreeting() {
            const hour = new Date().getHours();
            const el = document.getElementById('timeGreeting');
            if (hour < 12) el.innerText = "Selamat Pagi";
            else if (hour < 15) el.innerText = "Selamat Siang";
            else if (hour < 18) el.innerText = "Selamat Sore";
            else el.innerText = "Selamat Malam";
        }
        updateGreeting();

        // Toast Error Display
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // Render List Fungsi
        function renderList(containerId, dataList) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if (songs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-folder-open"></i>
                        <p>File music-data.js kosong atau tidak ditemukan.</p>
                    </div>`;
                return;
            }

            if (dataList.length === 0) {
                container.innerHTML = `<p style="color:var(--text-subdued); text-align:center; padding: 20px;">Tidak ada lagu ditemukan.</p>`;
                return;
            }

            dataList.forEach((song) => {
                const globalIndex = songs.findIndex(s => s.id === song.id);
                const isCurrent = globalIndex === currentIndex;
                
                const div = document.createElement('div');
                div.className = `song-item ${isCurrent ? 'playing' : ''}`;
                div.onclick = () => playSong(globalIndex);
                
                div.innerHTML = `
                    <img src="${song.cover}" class="song-cover" alt="cover" loading="lazy">
                    <div class="song-info">
                        <div class="song-title">${song.title}</div>
                        <div class="song-artist">${song.artist}</div>
                    </div>
                    <i class="fas fa-ellipsis-v song-action"></i>
                `;
                container.appendChild(div);
            });
        }

        function renderAllViews() {
            renderList('home-list', songs);
            const favSongs = songs.filter(s => favorites.includes(s.id));
            renderList('library-list', favSongs);
            
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const filtered = songs.filter(s => s.title.toLowerCase().includes(searchVal) || s.artist.toLowerCase().includes(searchVal));
            renderList('search-list', filtered);
        }

        renderAllViews();

        // Switch View / Tab
        function switchView(viewName) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`view-${viewName}`).classList.add('active');
            
            const navItems = document.querySelectorAll('.nav-item');
            if(viewName === 'home') { navItems[0].classList.add('active'); document.querySelector('header').style.display = 'block'; }
            if(viewName === 'search') { navItems[1].classList.add('active'); document.querySelector('header').style.display = 'none'; }
            if(viewName === 'library') { navItems[2].classList.add('active'); document.querySelector('header').style.display = 'none'; }
        }

        // Live Search
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = songs.filter(s => s.title.toLowerCase().includes(val) || s.artist.toLowerCase().includes(val));
            renderList('search-list', filtered);
        });

        // --- AUDIO PLAYER LOGIC ---
        function playSong(index) {
            if (index < 0 || index >= songs.length) return;
            
            if (currentIndex === index && isPlaying) {
                openFullPlayer();
                return;
            }

            currentIndex = index;
            const song = songs[currentIndex];
            
            audio.src = song.url;
            audio.play().then(() => {
                isPlaying = true;
                updatePlayButtons();
            }).catch(err => {
                showToast("Gagal memutar audio!");
                isPlaying = false;
                updatePlayButtons();
            });

            // Set UI Mini Player
            document.getElementById('miniPlayer').classList.add('visible');
            document.getElementById('mpCover').src = song.cover;
            document.getElementById('mpTitle').innerText = song.title;
            document.getElementById('mpArtist').innerText = song.artist;

            // Set UI Full Player
            document.getElementById('fpCover').src = song.cover;
            document.getElementById('fpTitle').innerText = song.title;
            document.getElementById('fpArtist').innerText = song.artist;
            document.getElementById('downloadBtn').href = song.url;

            // Media Session API Integration (Lock Screen Controls)
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: song.artist,
                    artwork: [{ src: song.cover, sizes: '512x512', type: 'image/jpeg' }]
                });

                navigator.mediaSession.setActionHandler('play', () => togglePlay());
                navigator.mediaSession.setActionHandler('pause', () => togglePlay());
                navigator.mediaSession.setActionHandler('previoustrack', () => prevSong());
                navigator.mediaSession.setActionHandler('nexttrack', () => nextSong());
            }

            // Extract Cover Color for Dynamic Background
            extractColorAndSetBg(document.getElementById('fpCover'));

            updatePlayButtons();
            updateFavButtons();
            renderAllViews();
        }

        function togglePlay(e) {
            if(e) e.stopPropagation();
            if (currentIndex === -1) return;
            
            if (isPlaying) { 
                audio.pause(); 
                isPlaying = false;
            } else { 
                audio.play().then(() => isPlaying = true).catch(() => showToast("Gagal memutar audio!")); 
            }
            updatePlayButtons();
        }

        function updatePlayButtons() {
            const mpBtn = document.getElementById('mpPlayBtn');
            const fpBtn = document.getElementById('fpPlayBtn');
            
            if (isPlaying) {
                mpBtn.className = 'fas fa-pause play-pause-btn';
                fpBtn.className = 'fas fa-pause-circle fp-ctrl-play';
            } else {
                mpBtn.className = 'fas fa-play play-pause-btn';
                fpBtn.className = 'fas fa-play-circle fp-ctrl-play';
            }
        }

        function nextSong() {
            if (songs.length === 0) return;

            if (isShuffle) {
                let nextIdx = Math.floor(Math.random() * songs.length);
                if (songs.length > 1 && nextIdx === currentIndex) {
                    nextIdx = (currentIndex + 1) % songs.length;
                }
                playSong(nextIdx);
            } else {
                let nextIdx = currentIndex + 1;
                if (nextIdx >= songs.length) nextIdx = 0;
                playSong(nextIdx);
            }
        }

        function prevSong() {
            if (songs.length === 0) return;
            let prevIdx = currentIndex - 1;
            if (prevIdx < 0) prevIdx = songs.length - 1;
            playSong(prevIdx);
        }

        // Shuffle & Repeat Handlers
        function toggleShuffle() {
            isShuffle = !isShuffle;
            const btn = document.getElementById('shuffleBtn');
            if (isShuffle) btn.classList.add('active');
            else btn.classList.remove('active');
        }

        function toggleRepeat() {
            repeatState = (repeatState + 1) % 3;
            const btn = document.getElementById('repeatBtn');
            if (repeatState === 0) {
                btn.className = "fas fa-redo fp-ctrl-btn";
            } else if (repeatState === 1) {
                btn.className = "fas fa-redo fp-ctrl-btn active";
            } else if (repeatState === 2) {
                btn.className = "fas fa-sync-alt fp-ctrl-btn active"; // Icon indicator for Repeat One
            }
        }

        // Auto Next on End
        audio.addEventListener('ended', () => {
            if (repeatState === 2) {
                audio.currentTime = 0;
                audio.play();
            } else if (repeatState === 1 || isShuffle || currentIndex < songs.length - 1) {
                nextSong();
            } else {
                isPlaying = false;
                updatePlayButtons();
            }
        });

        audio.addEventListener('error', () => {
            showToast("Lagu gagal dimuat!");
            isPlaying = false;
            updatePlayButtons();
        });

        // Full Player Modal
        function openFullPlayer() {
            if(currentIndex === -1) return;
            document.getElementById('fullPlayer').classList.add('open');
        }
        function closeFullPlayer() {
            document.getElementById('fullPlayer').classList.remove('open');
        }

        // Scrubbing & Touch Bar Progress
        const progressContainer = document.getElementById('progressContainer');
        
        function updateProgress(e) {
            if (!audio.duration) return;
            const rect = progressContainer.getBoundingClientRect();
            const clickX = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const width = rect.width;
            const percentage = Math.max(0, Math.min(1, clickX / width));
            audio.currentTime = percentage * audio.duration;
        }

        let isDragging = false;
        progressContainer.addEventListener('mousedown', (e) => { isDragging = true; updateProgress(e); });
        window.addEventListener('mousemove', (e) => { if (isDragging) updateProgress(e); });
        window.addEventListener('mouseup', () => { isDragging = false; });

        progressContainer.addEventListener('touchstart', (e) => { isDragging = true; updateProgress(e); });
        window.addEventListener('touchmove', (e) => { if (isDragging) updateProgress(e); });
        window.addEventListener('touchend', () => { isDragging = false; });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration && !isDragging) {
                const percent = (audio.currentTime / audio.duration) * 100;
                document.getElementById('progressBarFill').style.width = percent + '%';
                document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
                document.getElementById('totalTime').innerText = formatTime(audio.duration);
            }
        });

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // Volume Control
        document.getElementById('volumeSlider').addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        // Dynamic Color Extractor (Canvas Based)
        function extractColorAndSetBg(imgElement) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = imgElement.src;

            img.onload = function() {
                canvas.width = 1;
                canvas.height = 1;
                ctx.drawImage(img, 0, 0, 1, 1);
                const [r, g, b] = ctx.getImageData(0, 0, 1, 1).data;
                document.getElementById('fullPlayer').style.background = 
                    `linear-gradient(180deg, rgb(${Math.floor(r*0.5)}, ${Math.floor(g*0.5)}, ${Math.floor(b*0.5)}) 0%, var(--bg-base) 100%)`;
            };
            img.onerror = function() {
                document.getElementById('fullPlayer').style.background = `linear-gradient(180deg, #2a2a2a 0%, var(--bg-base) 100%)`;
            }
        }

        // Favorites Handler
        function toggleFav(e) {
            if(e) e.stopPropagation();
            if(currentIndex === -1) return;

            const songId = songs[currentIndex].id;
            const indexInFavs = favorites.indexOf(songId);

            if(indexInFavs > -1) favorites.splice(indexInFavs, 1);
            else favorites.push(songId);

            localStorage.setItem('kaishi_favs', JSON.stringify(favorites));
            updateFavButtons();
            renderAllViews();
        }

        function updateFavButtons() {
            if(currentIndex === -1) return;
            const songId = songs[currentIndex].id;
            const isFav = favorites.includes(songId);
            
            const mpFav = document.getElementById('mpFavBtn');
            const fpFav = document.getElementById('fpFavBtn');

            if(isFav) {
                mpFav.className = 'fas fa-heart';
                mpFav.style.color = 'var(--brand-color)';
                fpFav.className = 'fas fa-heart fp-fav active';
            } else {
                mpFav.className = 'far fa-heart';
                mpFav.style.color = 'var(--text-base)';
                fpFav.className = 'far fa-heart fp-fav';
            }
        }
    </script>
</body>
</html>
